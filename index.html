<index: element="k-dialog">
	{{if show}}
		<div as="thisdialog" style="z-index: {{zindex}}" class="k-overlay {{if hiding}}hiding{{/}} {{if static}}k-overlay-static{{else}}k-overlay-fixed{{/}} {{if big}}k-dialog-big{{/}} {{if effect}}k-dialog-effect-{{effect}}{{/}} {{if noanimation}}k-dialog-no-animation{{/}} {{if alignStart}}k-overlay-align-start{{/}}" on-click="click($event)" data-hidedialog="1">
			<div class="k-dialog{{if class}} {{class}}{{/}}{{if sticky}} k-dialog-sticky{{/}}{{if transparent}} k-dialog-transparent{{/}} {{if !noScroll}}scrollable{{/}}" as="outer" tabindex="0">
				{{if !hideclose}}
					<svg xmlns="http://www.w3.org/2000/svg" on-click="exit()" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" style="padding: 4px;" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x preview-icon k-close spin-90" on-click="click($event)" data-hidedialog="1"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
				{{/}}			
				<div class="k-dialog-inner" as="inner">
					{{@content}}
				</div>
			</div>
		</div>
	{{/}}
